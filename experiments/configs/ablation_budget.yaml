# OCR token-budget ablation; infinity reuses each dataset's main-table P2.
# DocVQA: 256/512/1024/2048; MyDataVQA: 128/256/512/1024.
defaults:
  bs: 1
  time: "yes"
  conda_env: vqa_train
  seed: 42
  output_root: /root/autodl-tmp/codes/Vqa_ocr/results_repro
models:
  llava: {model_name: llava, model_type: llava}
  qwen: {model_name: qwen, model_type: qwen}
  mplug: {model_name: mplug3, model_type: mplug}
jobs:
  - {dataset: docvqa, split: val, metric: anls, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 256}}
  - {dataset: docvqa, split: val, metric: anls, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 512}}
  - {dataset: docvqa, split: val, metric: anls, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 1024}}
  - {dataset: docvqa, split: val, metric: anls, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 2048}}
  # MyDataVQA has a shorter, dataset-specific grid:
  # LLaVA OCR-token p50/p90/p95/p99 = 204/524/676/1010.
  - {dataset: mydatavqa, split: test, metric: token_f1, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 128}}
  - {dataset: mydatavqa, split: test, metric: token_f1, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 256}}
  - {dataset: mydatavqa, split: test, metric: token_f1, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 512}}
  - {dataset: mydatavqa, split: test, metric: token_f1, models: [llava, mplug, qwen], variants: [ocr], phi: {order: native, template: p2, budget_tokens: 1024}}
