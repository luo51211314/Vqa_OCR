# =====================================================================
# 论文主表：3 数据集 x 3 模型 x {w/o OCR, OCR-P2} = 18 格
# 所有主表条件固定 order=native/template=p2/无限预算/无 L2 过滤。
# MyDataVQA 使用 reviewer-facing token_f1；其余数据集沿用官方指标。
# =====================================================================
postprocess: table3

defaults:
  bs: 1
  time: "yes"
  conda_env: vqa_train
  seed: 42
  output_root: /root/autodl-tmp/codes/Vqa_ocr/results_repro

models:
  llava: {model_name: llava, model_type: llava}
  qwen: {model_name: qwen, model_type: qwen}
  mplug: {model_name: mplug3, model_type: mplug}

jobs:
  - dataset: chartqa
    split: test
    metric: relaxed_accuracy
    models: [llava, mplug, qwen]
    variants: ["off", "ocr"]
    phi: {order: native, template: p2}

  - dataset: docvqa
    split: val
    metric: anls
    models: [llava, mplug, qwen]
    variants: ["off", "ocr"]
    phi: {order: native, template: p2}

  - dataset: mydatavqa
    split: test
    metric: token_f1
    models: [llava, mplug, qwen]
    variants: ["off", "ocr"]
    phi: {order: native, template: p2}
